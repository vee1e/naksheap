name: vercel

on:
  push:
    branches: [main]
    paths:
      - web/**
      - crates/naksheap-wasm/**
      - Cargo.lock
      - .github/workflows/**
  pull_request:
    paths:
      - web/**
      - crates/naksheap-wasm/**
      - Cargo.lock
      - .github/workflows/**

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy web ui
    runs-on: ubuntu-latest
    # The vercel-action receives a deploy token, so only runs on pushes where
    # the repository secrets are available and readable content. Fork PRs are
    # skipped because they never receive repository secrets.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The build needs the wasm module, so the Rust toolchain and
      # wasm-bindgen-cli are installed here too. The CLI version must match the
      # wasm-bindgen crate version in Cargo.lock, and it is read from the
      # lockfile rather than pinned twice.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: web

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install wasm-bindgen-cli at the locked version
        run: |
          version=$(cargo tree -p naksheap-wasm -i wasm-bindgen --depth 0 \
            | sed -n 's/.*wasm-bindgen v\(.*\)/\1/p' | head -1)
          echo "installing wasm-bindgen-cli $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      # Requires repository secrets:
      #   VERCEL_TOKEN       personal access token (vercel.com/account/tokens)
      #   VERCEL_ORG_ID      org id (vercel.com -> account settings)
      #   VERCEL_PROJECT_ID  project id (vercel.com -> project settings)
      # The web directory holds vercel.json with the build command and output
      # directory, so the project is configured by that file.
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@2d78157ee070f28ff89dd4da74e0369fc26d3b34 # v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '--preview' }}
